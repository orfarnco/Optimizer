# TradingView Strategy Optimizer Configuration
# Edit these values to set your default preferences

[DEFAULTS]
# Default trading symbol
symbol = NQ1!

# Default timeframe (1, 5, 15, 30, 60, 240, 1D, 1W)
timeframe = 1

# Default strategy name (must match TradingView exactly)
strategy = Supertrend Strategy

# Default backtest range (7d, 30d, 90d, 365d, 1y, all)
backtest_range = 365d

# Default maximum combinations to test
max_results = 50

[UI]
# Streamlit configuration
theme = light
# Options: light, dark

[ADVANCED]
# Browser settings
headless = false
# Set to true for headless operation (no browser window)

# Timeout settings (seconds)
page_timeout = 30
element_timeout = 10